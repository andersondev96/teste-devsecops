name: TCC DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  security-scans:
    name: OWASP API Security Scans
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v4

      - name: 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Instalar Dependências e Ferramentas
        run: |
          python -m pip install --upgrade pip
          pip install -r broken-api/requirements-dev.txt
          pip install bandit safety

      # ==========================================
      # ETAPAS DE SEGURANÇA (DEVSECOPS)
      # ==========================================

      - name: 4. Secret Scanning (Gitleaks)
        # Procura por chaves da AWS e senhas de banco deixadas no código
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 5. SCA - Análise de Dependências (Safety)
        # Verifica se as bibliotecas de execução e desenvolvimento têm CVEs conhecidas
        run: safety check -r broken-api/requirements-dev.txt --output json --save-json sca_report.json || true
        continue-on-error: true

      - name: 6. SAST - Análise Estática (Bandit)
        # Lê somente o código da aplicação; testes não são código de produção.
        run: bandit -r broken-api/ --exclude broken-api/tests -f json -o sast_report.json
        continue-on-error: true

      - name: 6.1. Testes de regressão da autenticação
        # Garante que a mitigação da API2 continue válida a cada push.
        run: pytest -q broken-api/tests/test_owasp_api_top_10_lab.py -k api2

      - name: 7. Build da Imagem Docker
        run: docker build -t vulnerable-api:latest ./broken-api

      - name: 8. Container Scan (Trivy)
        # Escaneia a imagem Docker gerada em busca de falhas no SO base
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'vulnerable-api:latest'
          format: 'json'
          output: 'trivy_report.json'
        continue-on-error: true

      - name: 9. Subir a API para o teste DAST
        # Roda o container em background no GitHub Actions
        run: |
          JWT_SECRET_KEY="$(openssl rand -hex 32)"
          docker run -d -p 8000:8000 \
            -e "JWT_SECRET_KEY=${JWT_SECRET_KEY}" \
            -e "ACCESS_TOKEN_EXPIRE_MINUTES=15" \
            vulnerable-api:latest

      - name: 10. Aguardar API ficar online
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/openapi.json > /dev/null; then
              echo "API disponível após ${attempt} tentativa(s)."
              exit 0
            fi
            sleep 2
          done
          echo "A API não ficou disponível a tempo. Logs do container:"
          docker ps -a
          docker logs $(docker ps -aq --filter ancestor=vulnerable-api:latest | head -n 1)
          exit 1

      - name: 11. DAST - OWASP ZAP API Scan
        # Simula ataques reais contra os endpoints rodando
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: 'http://localhost:8000/openapi.json'
          format: openapi
          # Gera o relatório no workspace para as etapas de artifacts e dashboard.
          # A ação não cria report_json.json localmente sem esta opção.
          cmd_options: '-J report_json.json'
          allow_issue_writing: false
          fail_action: false
        continue-on-error: true

      # ==========================================
      # EXTRAÇÃO DE DADOS PARA O SEU FRONTEND
      # ==========================================

      - name: 12. Salvar Relatórios (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-seguranca
          path: |
            sca_report.json
            sast_report.json
            trivy_report.json
            report_json.json

      - name: 13. Gerar Resumo para Histórico
        run: |
          # Extrai totais usando o comando 'jq' (já disponível no ambiente do GitHub)
          SAST_TOTAL=$(jq '.results | length' sast_report.json || echo 0)
          SCA_TOTAL=$(jq '.vulnerabilities | length' sca_report.json || echo 0)
          DAST_TOTAL=$(jq '.site[0].alerts | length' report_json.json || echo 0)
          TRIVY_TOTAL=$(jq '[.Results[].Vulnerabilities[]?] | length' trivy_report.json || echo 0)
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_SUBJECT=$(git log -1 --pretty=%s "$GITHUB_SHA")
          COMMIT_DESCRIPTION="$COMMIT_SUBJECT"

          # Em commits de merge, o subject é genérico ("Merge pull request...").
          # Prioriza a primeira linha útil do corpo, que contém a descrição do
          # commit/PR. Se o corpo estiver vazio, usa o commit associado ao merge.
          if printf '%s' "$COMMIT_SUBJECT" | grep -Eiq '^Merge (pull request|branch)'; then
            MERGE_DESCRIPTION=$(git log -1 --pretty=%b "$GITHUB_SHA" | awk 'NF && $0 !~ /^Merge (pull request|branch)/ { print; exit }')
            if [ -n "$MERGE_DESCRIPTION" ]; then
              COMMIT_DESCRIPTION="$MERGE_DESCRIPTION"
            elif git rev-parse "$GITHUB_SHA^2" >/dev/null 2>&1; then
              COMMIT_DESCRIPTION=$(git log -1 --no-merges --pretty=%s "$GITHUB_SHA^2")
            fi
          fi

          # Nunca persiste o subject genérico de um merge no histórico.
          if printf '%s' "$COMMIT_DESCRIPTION" | grep -Eiq '^Merge (pull request|branch)'; then
            COMMIT_DESCRIPTION="Descrição do commit associado ao merge não disponível."
          fi

          # Cria um objeto JSON com o resumo da execução atual
          jq -n \
            --arg date "$TIMESTAMP" \
            --arg description "$COMMIT_DESCRIPTION" \
            --arg commit "$COMMIT_SHA" \
            --argjson sast "$SAST_TOTAL" \
            --argjson sca "$SCA_TOTAL" \
            --argjson dast "$DAST_TOTAL" \
            --argjson trivy "$TRIVY_TOTAL" \
            '{date: $date, description: $description, commit: $commit, sast: $sast, sca: $sca, dast: $dast, trivy: $trivy, total: ($sast + $sca + $dast + $trivy)}' \
            > current_summary.json

      - name: 14. Persistir Histórico no Repositório
        # Pull Requests também usam checkout em detached HEAD, mas não devem
        # alterar o histórico da branch nem fazer push durante a validação.
        if: github.event_name == 'push'
        run: |
          HISTORY_FILE="painel-devsecops/src/data/history.json"
          DATA_DIR="painel-devsecops/src/data"
          RESET_MARKER=".github/reset-dashboard-history"
          REPORT_FILES=("sast_report.json" "sca_report.json" "report_json.json" "trivy_report.json")

          # Usa exatamente os relatórios que deram origem ao resumo atual.
          # Se algum relatório não existir, interrompe para não deixar dados antigos
          # misturados com o histórico novo.
          for REPORT_FILE in "${REPORT_FILES[@]}"; do
            if [ ! -f "$REPORT_FILE" ]; then
              echo "Relatório obrigatório não encontrado: $REPORT_FILE"
              exit 1
            fi
            cp "$REPORT_FILE" "$DATA_DIR/$REPORT_FILE"
          done

          # Permite reiniciar o contador uma única vez, sem apagar o histórico do Git.
          if [ -f "$RESET_MARKER" ]; then
            echo "Reiniciando o histórico do dashboard para o próximo deploy."
            printf '[]\n' > "$HISTORY_FILE"
            rm "$RESET_MARKER"
          fi

          # Lê o histórico atual, adiciona o novo resumo e mantém apenas as últimas 10 execuções
          jq -s '.[0] + [.[1]] | .[-10:]' "$HISTORY_FILE" current_summary.json > painel-devsecops/src/data/history.new.json
          mv painel-devsecops/src/data/history.new.json painel-devsecops/src/data/history.json

          # Configura o Git para commitar o arquivo de histórico atualizado
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "$HISTORY_FILE" "$DATA_DIR/sast_report.json" "$DATA_DIR/sca_report.json" "$DATA_DIR/report_json.json" "$DATA_DIR/trivy_report.json"
          # O marcador pode já ter sido removido em uma execução anterior.
          # Só o inclua se ainda existir no índice do Git.
          if git ls-files --error-unmatch "$RESET_MARKER" >/dev/null 2>&1; then
            git add -u -- "$RESET_MARKER"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "docs: atualiza histórico de vulnerabilidades [skip ci]"
            # actions/checkout deixa o runner em detached HEAD; informe
            # explicitamente a branch de origem do push.
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # ==========================================
      # ETAPAS DE DEPLOY AUTOMÁTICO (NOVO)
      # ==========================================

      - name: 15. Copiar Logs Fresquinhos para o Dashboard
        # Em push, os relatórios já foram copiados e versionados na etapa 14.
        if: github.event_name != 'push'
        run: |
          mkdir -p painel-devsecops/src/data
          cp sca_report.json painel-devsecops/src/data/
          cp sast_report.json painel-devsecops/src/data/
          cp trivy_report.json painel-devsecops/src/data/
          cp report_json.json painel-devsecops/src/data/

      - name: 16. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 17. Build do Dashboard React
        run: |
          cd painel-devsecops
          npm install
          npm run build

      - name: 18. Preparar Artefatos para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './painel-devsecops/dist'

  deploy:
    name: Publicar Dashboard
    # O GitHub Pages só deve ser publicado a partir da main. Pull Requests
    # usam refs/pull/*/merge, que não são aceitas pelas regras do ambiente.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: security-scans
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fazer o Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
